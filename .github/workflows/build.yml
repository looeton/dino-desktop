name: Build Desktop Installers

# 触发：推送 v* 标签 或 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 关键：默认的 GITHUB_TOKEN 只有读权限，electron-builder 创建 Release 会 403
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          # 阻止 electron-builder 自动探测 macOS 签名凭据（无证书，避免 keychain 卡死）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      # 兜底：即使发布到 Release 失败，构建产物仍可从 Actions 页面下载
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dino-runner-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
